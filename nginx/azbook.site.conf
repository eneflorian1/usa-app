server {
    listen 80;
    server_name azbook.site www.azbook.site;
    
    # Redirect to HTTPS (after certbot)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name azbook.site www.azbook.site;

    # SSL certs (certbot will fill these)
    # ssl_certificate /etc/letsencrypt/live/azbook.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/azbook.site/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
