name: Deploy usa-app to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install root + frontend, build frontend
        run: |
          npm install
          npm install --prefix frontend
          npm run build --prefix frontend
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Deploy via SSH/rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete --exclude=.git/ --exclude=node_modules/ --exclude=backend/node_modules/ --exclude=frontend/node_modules/ --exclude=backend/data/ --exclude=backend/ugc-output/ --exclude=.env --exclude=backend/.env --exclude=frontend/.env --exclude=openclaw-main/ --exclude=VisionClaw-main/ --exclude=android/"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/root/usa-app"

      - name: Post-Deploy / Install backend deps + PM2 Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            echo "===== Installing backend deps ====="
            cd /root/usa-app/backend
            PUPPETEER_SKIP_DOWNLOAD=true npm install --omit=dev

            echo "===== Installing frontend deps ====="
            cd /root/usa-app/frontend
            PUPPETEER_SKIP_DOWNLOAD=true npm install --omit=dev

            cd /root/usa-app

            echo "===== Reconciling pm2 config from ecosystem ====="
            for APP in usaapp usaapp-frontend; do
              EXPECTED_CWD=$(node -e "let c=require('/root/usa-app/ecosystem.config.js').apps.find(a=>a.name==='$APP');console.log(c?c.cwd:'')")
              CURRENT_CWD=$(pm2 jlist | node -e "let d=JSON.parse(require('fs').readFileSync(0));let a=d.find(x=>x.name==='$APP');console.log(a?a.pm2_env.pm_cwd||'':'MISSING')")
              echo "$APP: current=$CURRENT_CWD expected=$EXPECTED_CWD"
              if [ "$CURRENT_CWD" != "$EXPECTED_CWD" ]; then
                echo "  → stale/missing, replacing"
                pm2 delete "$APP" 2>/dev/null || true
                pm2 start ecosystem.config.js --only "$APP"
              else
                pm2 restart "$APP" --update-env
              fi
            done
            pm2 save

            echo "===== Waiting 15s to detect crash loops ====="
            sleep 15
            for APP in usaapp usaapp-frontend; do
              echo "===== LAST 60 LINES OF $APP LOGS ====="
              pm2 logs "$APP" --lines 60 --nostream --raw || true
            done

            echo "===== HEALTH CHECK ====="
            FAILED=0
            for APP in usaapp usaapp-frontend; do
              HEALTH=$(pm2 jlist | node -e "
                let d=JSON.parse(require('fs').readFileSync(0));
                let a=d.find(x=>x.name==='$APP');
                if(!a){console.log('NOT_FOUND|0|0');process.exit(0)}
                let uptimeMs=Date.now()-a.pm2_env.pm_uptime;
                console.log(a.pm2_env.status+'|'+uptimeMs+'|'+a.pm2_env.restart_time)
              ")
              STATUS=$(echo "$HEALTH" | cut -d'|' -f1)
              UPTIME_MS=$(echo "$HEALTH" | cut -d'|' -f2)
              RESTARTS=$(echo "$HEALTH" | cut -d'|' -f3)
              echo "$APP: status=$STATUS uptime=${UPTIME_MS}ms restarts=$RESTARTS"
              if [ "$STATUS" != "online" ] || [ "$UPTIME_MS" -lt 10000 ]; then
                echo "  ERROR: $APP unhealthy - likely crash-looping"
                FAILED=1
              fi
            done
            if [ "$FAILED" = "1" ]; then exit 1; fi
            echo "✓ All usa-app processes healthy"
